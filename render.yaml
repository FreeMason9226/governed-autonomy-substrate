services:
  - type: web
    name: gas-demo
    runtime: docker
    repo: https://github.com/FreeMason9226/governed-autonomy-substrate
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: '8000'
      - key: GAS_RUNTIME_MODE
        value: memory
      - key: GOVERNED_AUTONOMY_BEARER_TOKEN
        value: public-demo-token
      - key: GOVERNED_AUTONOMY_OPERATOR_TOKEN
        generateValue: true
      - key: GOVERNED_AUTONOMY_CORS_ORIGINS
        value: https://freemason9226.github.io
