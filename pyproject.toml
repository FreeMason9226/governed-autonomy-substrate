[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-autonomy-substrate"
version = "0.1.0"
description = "A governance authorization and execution barrier for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["governance", "ai-agents", "authorization", "audit", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["cryptography>=42.0", "jsonschema>=4.18"]

[project.optional-dependencies]
aws = [
    "boto3>=1.34",
]
postgres = [
    "psycopg[binary]>=3.2",
]
entra = [
    "msal>=1.30",
    "msal-extensions>=1.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "cryptography>=42.0",
    "jsonschema>=4.18",
]

[project.scripts]
gas-demo = "governed_autonomy.demo:main"
gas-server = "governed_autonomy.http_api:main"
gas = "governed_autonomy.cli:main"
gas-worker = "governed_autonomy.worker_main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["src/governed_autonomy"]
omit = ["*/demo.py"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/governed_autonomy"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
governed_autonomy = ["schemas/*.json"]
