apiVersion: apps/v1
kind: Deployment
metadata:
  name: gas-governance-signer
  labels: {app.kubernetes.io/name: gas-governance-signer, gas.io/role: governance}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: gas-governance-signer}}
  template:
    metadata: {labels: {app.kubernetes.io/name: gas-governance-signer, gas.io/role: governance}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: governance
          image: governed-autonomy-substrate:latest
          env:
            - name: GAS_KMS_SIGN_ENDPOINT
              valueFrom: {secretKeyRef: {name: gas-kms, key: endpoint}}
            - name: GAS_KMS_SIGN_TOKEN
              valueFrom: {secretKeyRef: {name: gas-kms, key: token}}
            - name: GAS_ISSUER_PUBLIC_KEY
              valueFrom: {secretKeyRef: {name: gas-kms, key: public-key}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gas-governance-signer-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: gas-governance-signer}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {gas.io/role: governance-admin}}}]
      ports: [{protocol: TCP, port: 8000}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: gas-postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{namespaceSelector: {}}]
      ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gas-execution-deny-governance}
spec:
  podSelector: {matchLabels: {gas.io/role: execution}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: gas-governance-signer}}}]
      ports: [{protocol: TCP, port: 8000}]