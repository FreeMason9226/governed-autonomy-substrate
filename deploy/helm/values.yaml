image:
  repository: ghcr.io/example/governed-autonomy-substrate
  tag: latest
  pullPolicy: IfNotPresent
replicaCount: 2
runtimeMode: postgres
bearerTokenSecret: governed-autonomy
databaseUrlSecret: governed-autonomy-runtime
runtimeSecret: governed-autonomy-runtime
createBearerTokenSecret: false
bearerToken: ""
service:
  type: ClusterIP
  port: 8000
probes:
  startupFailureThreshold: 36
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
networkPolicy:
  enabled: true
  ingressNamespaces: []
serviceMonitor:
  enabled: false
  bearerTokenSecret: governed-autonomy
  bearerTokenKey: bearer-token
prometheusRule:
  enabled: false
ingress:
  enabled: false
  className: nginx
  host: gas.example.com
  clusterIssuer: letsencrypt-prod
externalSecrets:
  enabled: false
  refreshInterval: 1h
  secretStoreName: gas-secrets
  secretStoreKind: ClusterSecretStore
  remoteKey: governed-autonomy/bearer-token
  remoteProperty: value
  databaseUrlRemoteKey: governed-autonomy/database-url
  issuerKeyIdRemoteKey: governed-autonomy/issuer-key-id
  issuerPrivateKeyRemoteKey: governed-autonomy/issuer-private-key
oidc:
  enabled: false
  tenantId: ""
  clientId: ""
  clientSecretSecret: ""
  redirectUri: ""
  issuer: ""
  audience: ""
  jwksUrl: ""
postgres:
  enabled: false
  image: postgres:16.4
  username: gas
  password: ""
  database: gas
  storage: 20Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: 1, memory: 1Gi}
  backup:
    enabled: false
    schedule: "17 2 * * *"
    image: postgres:16.4
    pvcName: gas-postgres-backups
    storage: 50Gi
worker:
  enabled: false
  replicaCount: 2
  image:
    repository: ghcr.io/example/governed-autonomy-substrate
    tag: latest
  command: ["gas-worker"]
  # Comma-separated allow-listed sandbox images (GAS_WORKER_IMAGES)
  allowedImages: ""
  vaultAddr: https://vault.security.svc.cluster.local:8200
  vaultNamespace: security
  vaultTokenSecret: ""
  metrics:
    enabled: true
    port: 9100
    serviceMonitor: false
    # Namespaces allowed to scrape the worker
    ingressNamespaces: [monitoring]
  sandbox:
    dropCapabilities: ["ALL"]
    readOnlyRootFilesystem: true
    runAsUser: 10001
    runAsGroup: 10001
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 1, memory: 512Mi}
