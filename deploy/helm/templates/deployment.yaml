apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "governed-autonomy.fullname" . }}
  labels:
    {{- include "governed-autonomy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "governed-autonomy.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "governed-autonomy.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: GAS_RUNTIME_MODE
              value: {{ .Values.runtimeMode | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseUrlSecret }}
                  key: url
            - name: GAS_ISSUER_KEY_ID
              valueFrom:
                secretKeyRef: {name: {{ .Values.runtimeSecret }}, key: issuer-key-id}
            - name: GAS_ISSUER_PRIVATE_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.runtimeSecret }}, key: issuer-private-key}
            - name: GOVERNED_AUTONOMY_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bearerTokenSecret }}
                  key: bearer-token
            {{- if .Values.oidc.enabled }}
            - name: OIDC_ISSUER
              value: {{ required "values.oidc.issuer is required when oidc.enabled is true" .Values.oidc.issuer | quote }}
            - name: OIDC_AUDIENCE
              value: {{ required "values.oidc.audience is required when oidc.enabled is true" .Values.oidc.audience | quote }}
            - name: OIDC_JWKS_URL
              value: {{ required "values.oidc.jwksUrl is required when oidc.enabled is true" .Values.oidc.jwksUrl | quote }}
            {{- end }}
          readinessProbe:
            exec:
              command: ["python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/readyz',headers={'Authorization':'Bearer '+os.environ['GOVERNED_AUTONOMY_BEARER_TOKEN']}); urllib.request.urlopen(r)"]
          livenessProbe:
            exec:
              command: ["python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/livez',headers={'Authorization':'Bearer '+os.environ['GOVERNED_AUTONOMY_BEARER_TOKEN']}); urllib.request.urlopen(r)"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
