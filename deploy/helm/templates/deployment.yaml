{{- if and .Values.kms.enabled (not (or .Values.serviceAccount.create .Values.serviceAccount.name)) }}
{{- fail "kms.enabled requires serviceAccount.create=true or serviceAccount.name for workload identity" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "governed-autonomy.fullname" . }}
  labels:
    {{- include "governed-autonomy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "governed-autonomy.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "governed-autonomy.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ include "governed-autonomy.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.kms.enabled }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: GAS_RUNTIME_MODE
              value: {{ .Values.runtimeMode | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseUrlSecret }}
                  key: url
            {{- if .Values.kms.enabled }}
            - name: GAS_ISSUER_SIGNER
              value: "aws-kms"
            - name: GAS_ISSUER_KMS_KEY_ID
              value: {{ required "values.kms.keyId is required when kms.enabled is true" .Values.kms.keyId | quote }}
            {{- if .Values.kms.region }}
            - name: AWS_REGION
              value: {{ .Values.kms.region | quote }}
            {{- end }}
            {{- else }}
            - name: GAS_ISSUER_KEY_ID
              valueFrom:
                secretKeyRef: {name: {{ .Values.runtimeSecret }}, key: issuer-key-id}
            - name: GAS_ISSUER_PRIVATE_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.runtimeSecret }}, key: issuer-private-key}
            {{- end }}
            - name: GOVERNED_AUTONOMY_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bearerTokenSecret }}
                  key: bearer-token
            - name: GOVERNED_AUTONOMY_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bearerTokenSecret }}
                  key: operator-token
                  optional: true
            {{- if .Values.oidc.enabled }}
            {{- if or .Values.oidc.tenantId .Values.oidc.clientId }}
            - name: ENTRA_TENANT_ID
              value: {{ required "values.oidc.tenantId is required for Entra ID" .Values.oidc.tenantId | quote }}
            - name: ENTRA_CLIENT_ID
              value: {{ required "values.oidc.clientId is required for Entra ID" .Values.oidc.clientId | quote }}
            {{- if .Values.oidc.redirectUri }}
            - name: ENTRA_REDIRECT_URI
              value: {{ .Values.oidc.redirectUri | quote }}
            - name: ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.clientSecretSecret | default .Values.runtimeSecret }}
                  key: entra-client-secret
                  optional: true
            {{- end }}
            {{- else }}
            - name: OIDC_ISSUER
              value: {{ required "values.oidc.issuer is required when oidc.enabled is true" .Values.oidc.issuer | quote }}
            - name: OIDC_AUDIENCE
              value: {{ required "values.oidc.audience is required when oidc.enabled is true" .Values.oidc.audience | quote }}
            - name: OIDC_JWKS_URL
              value: {{ required "values.oidc.jwksUrl is required when oidc.enabled is true" .Values.oidc.jwksUrl | quote }}
            {{- end }}
            {{- end }}
          startupProbe:
            exec:
              command: ["python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/livez',headers={'Authorization':'Bearer '+os.environ['GOVERNED_AUTONOMY_BEARER_TOKEN']}); urllib.request.urlopen(r)"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: {{ .Values.probes.startupFailureThreshold }}
          readinessProbe:
            exec:
              command: ["python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/readyz',headers={'Authorization':'Bearer '+os.environ['GOVERNED_AUTONOMY_BEARER_TOKEN']}); urllib.request.urlopen(r)"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/livez',headers={'Authorization':'Bearer '+os.environ['GOVERNED_AUTONOMY_BEARER_TOKEN']}); urllib.request.urlopen(r)"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
