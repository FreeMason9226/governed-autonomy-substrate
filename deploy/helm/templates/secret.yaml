{{- if .Values.createBearerTokenSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bearerTokenSecret }}
  labels:
    {{- include "governed-autonomy.labels" . | nindent 4 }}
type: Opaque
stringData:
  bearer-token: {{ required "values.bearerToken is required when createBearerTokenSecret is true" .Values.bearerToken | quote }}
{{- end }}