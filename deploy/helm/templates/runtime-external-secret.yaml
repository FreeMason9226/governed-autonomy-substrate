{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.runtimeSecret }}
  labels:
    {{- include "governed-autonomy.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ .Values.runtimeSecret }}
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef: {key: {{ .Values.externalSecrets.databaseUrlRemoteKey | quote }}}
    - secretKey: issuer-key-id
      remoteRef: {key: {{ .Values.externalSecrets.issuerKeyIdRemoteKey | quote }}}
    - secretKey: issuer-private-key
      remoteRef: {key: {{ .Values.externalSecrets.issuerPrivateKeyRemoteKey | quote }}}
{{- end }}