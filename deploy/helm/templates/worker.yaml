{{- if .Values.worker.enabled }}
{{- if and .Values.kms.enabled (not (or .Values.serviceAccount.create .Values.serviceAccount.name)) }}
{{- fail "kms.enabled requires serviceAccount.create=true or serviceAccount.name for workload identity" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "governed-autonomy.fullname" . }}-worker
  labels:
    {{- include "governed-autonomy.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "governed-autonomy.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "governed-autonomy.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ include "governed-autonomy.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.kms.enabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.worker.sandbox.runAsUser }}
        runAsGroup: {{ .Values.worker.sandbox.runAsGroup }}
        fsGroup: {{ .Values.worker.sandbox.runAsGroup }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toJson .Values.worker.command }}
          env:
            - name: GAS_RUNTIME_MODE
              value: {{ .Values.runtimeMode | quote }}
            - name: GAS_WORKER_IMAGES
              value: {{ required "values.worker.allowedImages is required" .Values.worker.allowedImages | quote }}
            {{- if .Values.kms.enabled }}
            - name: GAS_ISSUER_SIGNER
              value: "aws-kms"
            - name: GAS_ISSUER_KMS_KEY_ID
              value: {{ required "values.kms.keyId is required when kms.enabled is true" .Values.kms.keyId | quote }}
            {{- if .Values.kms.region }}
            - name: AWS_REGION
              value: {{ .Values.kms.region | quote }}
            {{- end }}
            {{- else }}
            - name: GAS_ISSUER_KEY_ID
              valueFrom:
                secretKeyRef: {name: {{ .Values.runtimeSecret }}, key: issuer-key-id}
            - name: GAS_ISSUER_PRIVATE_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.runtimeSecret }}, key: issuer-private-key}
            {{- end }}
            - name: VAULT_ADDR
              value: {{ .Values.worker.vaultAddr | quote }}
            {{- if .Values.worker.vaultTokenSecret }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.worker.vaultTokenSecret | quote }}, key: token}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseUrlSecret }}
                  key: url
            {{- if .Values.worker.metrics.enabled }}
            - name: GAS_WORKER_METRICS_PORT
              value: {{ .Values.worker.metrics.port | quote }}
            - name: GAS_WORKER_METRICS_HOST
              value: "0.0.0.0"
            {{- end }}
          {{- if .Values.worker.metrics.enabled }}
          ports:
            - {name: metrics, containerPort: {{ .Values.worker.metrics.port }}}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.worker.sandbox.readOnlyRootFilesystem }}
            capabilities:
              drop: {{ toJson .Values.worker.sandbox.dropCapabilities }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "governed-autonomy.fullname" . }}-worker
  labels:
    {{- include "governed-autonomy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  policyTypes: [Ingress, Egress]
  {{- if .Values.worker.metrics.enabled }}
  ingress:
    - from:
        {{- range .Values.worker.metrics.ingressNamespaces }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ . | quote }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.worker.metrics.port }}}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to: [{namespaceSelector: {}}]
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.worker.vaultNamespace | quote }}}
      ports:
        - {protocol: TCP, port: 8200}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: {{ include "governed-autonomy.name" . }}-postgres
      ports:
        - {protocol: TCP, port: 5432}
{{- if .Values.worker.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "governed-autonomy.fullname" . }}-worker-metrics
  labels:
    {{- include "governed-autonomy.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-metrics
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "governed-autonomy.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: worker
  ports:
    - {name: metrics, port: {{ .Values.worker.metrics.port }}, targetPort: metrics}
{{- if .Values.worker.metrics.serviceMonitor }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "governed-autonomy.fullname" . }}-worker
  labels:
    {{- include "governed-autonomy.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker-metrics
  endpoints:
    - {port: metrics, path: /metrics}
{{- end }}
{{- end }}
{{- end }}
