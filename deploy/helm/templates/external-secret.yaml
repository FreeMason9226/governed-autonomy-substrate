{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.bearerTokenSecret }}
  labels:
    {{- include "governed-autonomy.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ .Values.bearerTokenSecret }}
    creationPolicy: Owner
  data:
    - secretKey: bearer-token
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: {{ .Values.externalSecrets.remoteProperty }}
{{- end }}
