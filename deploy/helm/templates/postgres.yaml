{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "governed-autonomy.fullname" . }}-postgres
  labels:
    {{- include "governed-autonomy.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ required "values.postgres.password is required when postgres.enabled is true" .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "governed-autonomy.fullname" . }}-postgres
  labels:
    {{- include "governed-autonomy.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "governed-autonomy.name" . }}-postgres
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "governed-autonomy.fullname" . }}-postgres
  labels:
    {{- include "governed-autonomy.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "governed-autonomy.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "governed-autonomy.name" . }}-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "governed-autonomy.name" . }}-postgres
    spec:
      securityContext: {fsGroup: 999}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ include "governed-autonomy.fullname" . }}-postgres, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "governed-autonomy.fullname" . }}-postgres, key: password}}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
          readinessProbe: {exec: {command: ["pg_isready", "-U", "$(POSTGRES_USER)"]}}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: {{ .Values.postgres.storage }} }
{{- end }}
---
{{- if .Values.postgres.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.postgres.backup.pvcName }}
  labels:
    {{- include "governed-autonomy.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: {{ .Values.postgres.backup.storage }} }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "governed-autonomy.fullname" . }}-postgres-backup
  labels:
    {{- include "governed-autonomy.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: {{ .Values.postgres.backup.image | quote }}
              env:
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: {{ include "governed-autonomy.fullname" . }}-postgres, key: password}}
              command: ["/bin/sh", "-c"]
              args: ["pg_dump -h {{ include "governed-autonomy.fullname" . }}-postgres -U $POSTGRES_USER {{ .Values.postgres.database }} | gzip > /backup/{{ .Release.Name }}-$(date +%Y%m%d%H%M%S).sql.gz"]
              envFrom:
                - secretRef: {name: {{ include "governed-autonomy.fullname" . }}-postgres}
              volumeMounts: [{name: backup, mountPath: /backup}]
          volumes: [{name: backup, persistentVolumeClaim: {claimName: {{ .Values.postgres.backup.pvcName }}}}]
{{- end }}
