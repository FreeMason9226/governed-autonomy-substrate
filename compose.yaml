version: '3.8'
services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://test:test@postgres:5432/test_db
      # other envs for tests
    ports:
      - "8000:8000"
    depends_on:
      - postgres
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test" ]
      interval: 10s
      timeout: 5s
      retries: 5
