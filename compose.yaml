version: '3.8'
services:
  app:
    build: .
    environment:
      GOVERNED_AUTONOMY_BEARER_TOKEN: ${GOVERNED_AUTONOMY_BEARER_TOKEN:-local-development-token}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
