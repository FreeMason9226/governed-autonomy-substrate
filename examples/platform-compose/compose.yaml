version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gas
      POSTGRES_PASSWORD: gas
      POSTGRES_DB: gas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gas -d gas"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    command: ["gas", "migrate", "--database-url", "******postgres:5432/gas"]
    environment:
      GAS_RUNTIME_MODE: memory
      GAS_CONTROL_PLANE_DATABASE_URL: ******postgres:5432/gas

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      GOVERNED_AUTONOMY_BEARER_TOKEN: ${GOVERNED_AUTONOMY_BEARER_TOKEN:-local-development-token}
      GAS_RUNTIME_MODE: memory
      GAS_CONTROL_PLANE_DATABASE_URL: ******postgres:5432/gas
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/v1/ready',headers={'Authorization':'Bearer '+os.environ['GOVERNED_AUTONOMY_BEARER_TOKEN']}); urllib.request.urlopen(r)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  worker:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["gas-worker", "--poll-interval", "0.5", "--retry-delay", "0.5"]
    environment:
      GOVERNED_AUTONOMY_BEARER_TOKEN: ${GOVERNED_AUTONOMY_BEARER_TOKEN:-local-development-token}
      GAS_RUNTIME_MODE: memory
      GAS_CONTROL_PLANE_DATABASE_URL: ******postgres:5432/gas
