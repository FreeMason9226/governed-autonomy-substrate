name: Helm

on:
  pull_request:
    paths: ['deploy/helm/**']
  push:
    branches: [main]
    paths: ['deploy/helm/**']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
      - run: helm lint deploy/helm
      - run: helm template gas deploy/helm > /dev/null
      - name: Template with worker metrics and ServiceMonitor
        run: helm template gas deploy/helm --set worker.enabled=true --set worker.metrics.serviceMonitor.enabled=true > /dev/null
