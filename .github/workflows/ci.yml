name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          check-latest: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8 || true
          npm ci || true
      - name: Run linters
        run: |
          ruff check . || true
          flake8 || true
          npm run lint --if-present || true

  test:
    name: Test matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]
        include:
          - python-version: "3.11"
    steps:
      - uses: actions/checkout@v5

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-${{ matrix.python-version }}-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Show environment
        run: |
          echo "=== System info ==="
          uname -a
          lsb_release -a || true
          echo "=== Python ==="
          python --version
          which python
          python -m pip --version
          echo "=== Node ==="
          node --version || true
          npm --version || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install poetry && poetry install --no-interaction --no-ansi || true; fi

      - name: Install Node dependencies (if present)
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Run unit tests
        run: |
          pytest -q -vv
        continue-on-error: false

  build:
    name: Build artifacts
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          if [ -f Dockerfile ]; then
            docker build -t gha-build:latest .
          else
            echo "No Dockerfile found, skipping docker build"
          fi

      - name: Package wheel (Python)
        run: |
          if [ -f setup.py ] || [ -f pyproject.toml ]; then
            python -m pip install build
            python -m build || true
          else
            echo "No Python packaging config found, skipping"
          fi

  integration:
    name: Integration smoke (optional)
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - name: Start services with docker-compose
        run: |
          if [ -f docker-compose.dev.yml ]; then
            docker compose -f docker-compose.dev.yml up -d --build
            sleep 5
            docker compose -f docker-compose.dev.yml ps
            # run a simple health check if available
            curl --fail http://localhost:8080/health || true
            docker compose -f docker-compose.dev.yml down
          else
            echo "No docker-compose.dev.yml found, skipping integration"
          fi
