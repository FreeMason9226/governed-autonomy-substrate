name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPATH: .
  REGISTRY: ghcr.io
  IMAGE_NAME: freemason9226/governed-autonomy-substrate

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src
      - name: Type check
        run: >-
          mypy
          src/governed_autonomy/canonical.py
          src/governed_autonomy/crypto.py
          src/governed_autonomy/health.py
          src/governed_autonomy/replay.py
          --ignore-missing-imports
      - name: Test
        run: >-
          python -m pytest
          --cov=governed_autonomy
          --cov-report=term-missing
          --cov-report=xml
      - name: Validate Helm chart
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Render Helm chart
        run: helm lint deploy/helm && helm template gas deploy/helm --set createBearerTokenSecret=true --set bearerToken=ci-token
      - name: Render Helm chart with KMS workload identity
        run: >-
          helm template gas deploy/helm
          --set kms.enabled=true
          --set kms.keyId=alias/gas-ci
          --set serviceAccount.create=true
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

  postgres-integration:
    name: PostgreSQL runtime integration
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gas
          POSTGRES_PASSWORD: gas-ci-password
          POSTGRES_DB: gas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gas -d gas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and PostgreSQL dependencies
        run: python -m pip install -e '.[dev,postgres]'
      - name: Run PostgreSQL integration tests
        env:
          GAS_POSTGRES_TEST_URL: postgresql://gas:gas-ci-password@127.0.0.1:5432/gas
        run: python -m pytest tests/test_postgres_integration.py tests/test_postgres_jobs.py -q

  package:
    name: Build Python package and container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Build wheel and source distribution
        run: python -m pip install build && python -m build
      - name: Generate source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-source.cdx.json
      - name: Build container
        run: docker build --tag "$REGISTRY/${IMAGE_NAME}:${GITHUB_SHA}" .
      - name: Generate container SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-container.cdx.json
      - name: Save container image
        run: docker save "$REGISTRY/${IMAGE_NAME}:${GITHUB_SHA}" -o container.tar
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/*
            sbom-*.cdx.json
            container.tar

  security:
    name: Security scans
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and audit dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e '.[aws,dev,entra,postgres]' pip-audit bandit
      - name: Audit Python dependencies
        run: pip-audit --local
      - name: Scan Python source
        run: bandit -r src -q
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
      - name: Scan container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: container.tar
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret

  integration:
    name: Compose smoke test
    needs: package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start stack
        run: docker compose up -d --build
        env:
          GOVERNED_AUTONOMY_BEARER_TOKEN: ci-test-token
      - name: Wait for readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent -H 'Authorization: Bearer ci-test-token' http://localhost:8000/readyz; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Verify authenticated API
        run: |
          curl --fail --silent -H 'Authorization: Bearer ci-test-token' http://localhost:8000/health
          curl --fail --silent -H 'Authorization: Bearer ci-test-token' http://localhost:8000/openapi.json
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publish image
    needs: [security, integration]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-dev:
    name: Deploy development
    needs: publish
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Configure cluster credentials
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          test -n "$KUBECONFIG_B64"
          echo "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Deploy and wait
        run: >-
          helm upgrade --install governed-autonomy deploy/helm
          --namespace governed-autonomy-dev --create-namespace
          --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          --set image.tag=${{ github.sha }}
          --wait --timeout 5m

  deploy-staging:
    name: Deploy staging
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Configure cluster credentials
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          test -n "$KUBECONFIG_B64"
          echo "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Deploy and wait
        run: >-
          helm upgrade --install governed-autonomy deploy/helm
          --namespace governed-autonomy-staging --create-namespace
          --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          --set image.tag=${{ github.ref_name }}
          --wait --timeout 5m

  deploy-production:
    name: Deploy production
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Configure cluster credentials
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          test -n "$KUBECONFIG_B64"
          echo "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Deploy and wait
        run: >-
          helm upgrade --install governed-autonomy deploy/helm
          --namespace governed-autonomy --create-namespace
          --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          --set image.tag=${{ github.ref_name }}
          --wait --timeout 5m

  production-verification:
    name: Production conformance and load verification
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run protocol conformance suite
        run: python -m pytest tests/conformance -q
      - name: Run deployed load smoke test
        env:
          GAS_URL: ${{ vars.GAS_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
          GAS_REQUESTS: '250'
          GAS_WORKERS: '25'
          GAS_P95_LIMIT: '1.0'
        run: python tests/load_smoke.py
      - name: Verify rollback command is available
        run: bash deploy/scripts/rollback-smoke.sh --help || test $? -eq 2

  release:
    name: Create GitHub release
    needs: [publish, production-verification]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*
            sbom-*.cdx.json
