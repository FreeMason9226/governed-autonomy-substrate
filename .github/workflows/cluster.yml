name: Cluster test

on:
  workflow_dispatch:
  pull_request:
    paths: ['deploy/helm/**', 'Dockerfile', 'src/**']
  push:
    branches: [main]
    paths: ['deploy/helm/**', 'Dockerfile', '.github/workflows/cluster.yml']

permissions:
  contents: read

jobs:
  kind:
    name: Helm install on a kind cluster
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOKEN: cluster-test-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: gas
      - name: Build and load image
        run: |
          docker build -t gas-ci:test .
          kind load docker-image gas-ci:test --name gas
      - name: Create namespace and secrets
        run: |
          kubectl create namespace gas
          SEED=$(python3 -c "import os,base64;print(base64.urlsafe_b64encode(os.urandom(32)).decode().rstrip('='))")
          kubectl -n gas create secret generic governed-autonomy --from-literal=bearer-token="$TOKEN" --from-literal=operator-token="$TOKEN-op"
          kubectl -n gas create secret generic governed-autonomy-runtime \
            --from-literal=url="postgresql://gas:ci-password@governed-autonomy-postgres:5432/gas" \
            --from-literal=issuer-key-id=ci-issuer \
            --from-literal=issuer-private-key="$SEED"
      - name: Install chart
        run: |
          helm upgrade --install gas deploy/helm -n gas \
            --set image.repository=gas-ci --set image.tag=test --set image.pullPolicy=Never \
            --set replicaCount=2 \
            --set postgres.enabled=true --set postgres.password=ci-password --set postgres.storage=1Gi \
            --set worker.enabled=true --set worker.image.repository=gas-ci --set worker.image.tag=test \
            --set worker.allowedImages=alpine:3 --set worker.replicaCount=1 \
            --timeout 3m --wait
      - name: Verify rollout
        run: |
          kubectl -n gas rollout status deploy/governed-autonomy --timeout=3m
          kubectl -n gas get pods,svc,pvc
      - name: Exercise the API through the Service
        run: |
          kubectl -n gas port-forward svc/governed-autonomy 8000:8000 >/tmp/pf.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:8000/livez && break; sleep 1; done
          H="Authorization: Bearer $TOKEN"
          curl -fsS -H "$H" localhost:8000/livez
          curl -fsS -H "$H" localhost:8000/readyz
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/livez)" = 401
          curl -fsS -H "$H" localhost:8000/health
          curl -s -H "$H" -H 'Content-Type: application/json' localhost:8000/authorize \
            -d '{"policy_id":"demo-files-v1","request":{"action":"write_file","path":"out.txt","content":"hello"}}' > gaa.json
          python3 -c "import json;d=json.load(open('gaa.json'));assert d.get('signature') or d.get('artifact_payload'), d"
          echo "{\"artifact\": $(cat gaa.json)}" > exec.json
          curl -fsS -H "$H" -H 'Content-Type: application/json' localhost:8000/execute -d @exec.json
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$H" -H 'Content-Type: application/json' localhost:8000/execute -d @exec.json)
          echo "replay -> $code"; test "$code" -ge 400
          curl -fsS -H "$H" localhost:8000/health | python3 -c "import json,sys;c=json.load(sys.stdin)['checks']['replay_chain'];assert c['ok'] and c['frames']>=2, c"
          # state must survive a pod restart (Postgres-backed)
          kubectl -n gas rollout restart deploy/governed-autonomy
          kubectl -n gas rollout status deploy/governed-autonomy --timeout=3m
          pkill -f "port-forward" || true
          kubectl -n gas port-forward svc/governed-autonomy 8000:8000 >/tmp/pf2.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:8000/livez && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$H" -H 'Content-Type: application/json' localhost:8000/execute -d @exec.json)
          echo "replay after restart -> $code"; test "$code" -ge 400
      - name: Worker claims and re-verifies a queued job
        run: |
          kubectl -n gas rollout status deploy/governed-autonomy-worker --timeout=3m
          kubectl -n gas port-forward svc/governed-autonomy 8000:8000 >/tmp/pf3.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:8000/livez && break; sleep 1; done
          H="Authorization: Bearer $TOKEN"; OP="Authorization: Bearer $TOKEN-op"
          curl -s -H "$H" -H 'Content-Type: application/json' localhost:8000/authorize \
            -d '{"policy_id":"demo-files-v1","request":{"action":"write_file","path":"job.txt","content":"job"}}' > gaa2.json
          python3 -c "import json;print(json.dumps({'artifact':json.load(open('gaa2.json')),'idempotency_key':'ci-1','max_attempts':1}))" > job.json
          curl -fsS -H "$OP" -H "X-Operator: ci" -H 'Content-Type: application/json' localhost:8000/admin/jobs -d @job.json | tee submitted.json
          id=$(python3 -c "import json;print(json.load(open('submitted.json'))['job_id'])")
          for i in $(seq 1 30); do
            st=$(curl -fsS -H "$OP" localhost:8000/admin/jobs/$id | python3 -c "import json,sys;print(json.load(sys.stdin)['status'])")
            echo "job $id -> $st"
            test "$st" != queued && test "$st" != running && break
            sleep 2
          done
          # no container runtime in the pod, so the job ends in dead_letter; the worker still claimed it
          test "$st" = dead_letter
          # the worker consumed the artifact, so a direct execute is now a replay
          echo "{\"artifact\": $(cat gaa2.json)}" > exec2.json
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$H" -H 'Content-Type: application/json' localhost:8000/execute -d @exec2.json)
          echo "execute after worker -> $code"; test "$code" -ge 400
          kubectl -n gas exec deploy/governed-autonomy-worker -- python -c "import urllib.request as u;print(u.urlopen('http://127.0.0.1:9100/metrics').read().decode())"
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n gas get all,events
          kubectl -n gas describe pods | tail -80
          for p in $(kubectl -n gas get pods -o name | grep -v postgres); do echo "== $p"; kubectl -n gas logs $p --tail=60; kubectl -n gas logs $p --previous --tail=60 || true; done

